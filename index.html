<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakstraat Logboek</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E4C92">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lakstraat">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=3"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: werkplaats-logboek — lijst met lakdagen links, invulblad per dag rechts; op telefoon onder elkaar */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --sunk:#E4E9F0; --line:#CAD3DF;
  --fg:#141C26; --muted:#56637A; --accent:#0E4C92; --accent-fg:#FFFFFF; --accent-soft:#DCE7F5;
  --brand:#0E4C92; --brand-fg:#FFFFFF;
  --warn:#9A5B00; --warn-soft:#FBEBD0; --danger:#B3261E; --danger-soft:#F9DEDC;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --panel:#171E28; --sunk:#0B1016; --line:#2A3544;
  --fg:#E3E9F2; --muted:#93A1B6; --accent:#7FB0EA; --accent-fg:#07121F; --accent-soft:#18304F;
  --brand:#0E4C92; --brand-fg:#FFFFFF;
  --warn:#F0B35A; --warn-soft:#3A2A10; --danger:#F2857C; --danger-soft:#3D1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --panel:#171E28; --sunk:#0B1016; --line:#2A3544;
  --fg:#E3E9F2; --muted:#93A1B6; --accent:#7FB0EA; --accent-fg:#07121F; --accent-soft:#18304F;
  --brand:#0E4C92; --brand-fg:#FFFFFF;
  --warn:#F0B35A; --warn-soft:#3A2A10; --danger:#F2857C; --danger-soft:#3D1715; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.auth{max-width:400px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px}
.auth h2{font-family:var(--f-display);font-size:28px;margin:0;text-transform:uppercase}
.auth p{margin:0;color:var(--muted);font-size:14px}
.auth .inp input{font-family:var(--f-body);font-size:16px}
.auth .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-align:left}
.ok{color:var(--accent);font-size:14px}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--brand);color:var(--brand-fg);border-radius:8px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.brand-logo{height:56px;width:auto;display:block}
.brand{border-left:1px solid rgba(255,255,255,.35);padding-left:22px;min-width:0}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:3px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
@media (max-width:560px){.brand{border-left:0;padding-left:0}.brand h1{font-size:28px}.brand-logo{height:46px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:6px;padding:10px 14px;font-size:14px}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}

/* lijst */
aside.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list h2{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.list ul{list-style:none;margin:0;padding:0;max-height:560px;overflow-y:auto}
@media (max-width:760px){.list ul{max-height:220px}}
.list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.list li:last-child button{border-bottom:0}
.list li button:hover{background:var(--sunk)}
.list li button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.list .d{font-weight:600}
.list .wd{font-size:12px;color:var(--muted)}
.list .cond{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.list .flag{font-size:11px;color:var(--warn);grid-column:1/-1}
.list .empty{padding:18px 14px;color:var(--muted);font-size:14px}

/* blad */
main.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-head .title{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;text-transform:capitalize}
.sheet-head .sub{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 10px}
.status{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.status.dirty{background:var(--warn-soft);color:var(--warn)}
.status.saved{background:var(--accent-soft);color:var(--accent)}

.section{padding:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.section:last-of-type{border-bottom:0}
.section h3{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section h3 a,.section h3 button.link{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:13px;color:var(--accent);background:none;border:0;padding:0;font-weight:500}

.conds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.conds{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--sunk);overflow:hidden}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.inp input{border:0;background:transparent;padding:9px 10px;width:100%;min-width:0;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.inp input:focus{outline:none}
.inp .unit{padding:0 10px;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.hint{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

.walsen{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wals .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.wals .cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.wals .grp-t{font-family:var(--f-body);font-size:13px;font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.wals{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.wals .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.wals .nm b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.wals .nm .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wals.gone{opacity:.75;border-style:dashed}
.stepper{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.stepper:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stepper button{border:0;background:transparent;font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.stepper button:hover{background:var(--line);color:var(--fg)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:21px;font-weight:600;padding:6px 0;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.delta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:-4px}
.wals .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.stepper.eind{background:var(--accent-soft)}
.delta.chg{color:var(--warn)}

textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:10px 12px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 8px 8px}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

.blank{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.blank strong{font-family:var(--f-display);font-size:26px;color:var(--fg);font-weight:600}

/* walsen instellen */
.setup{display:flex;flex-direction:column;gap:8px}
.setup-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center}
.setup-row .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.setup-row input{border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:8px 10px;width:100%;min-width:0}
.setup-row .ctl{display:flex;gap:2px}
.setup-row .ctl button{border:1px solid transparent;background:none;border-radius:4px;padding:4px 8px;color:var(--muted)}
.setup-row .ctl button:hover{border-color:var(--line);color:var(--fg)}
/* ---- tabbladen ---- */
:root{--paper:#FFFFFF;--paper-fg:#111111;--paper-line:#1A1A1A;--paper-soft:#8A8F98;--paper-hover:#EEF2F8;--ink:#1F3C9A;--ink-bad:#C0262D}
.toolbar{flex-direction:column;align-items:stretch}
.toolrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunk);padding:4px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:6px;font-weight:500;color:var(--muted)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sheet.solo{max-width:100%}
.paper-wrap{padding:18px;overflow-x:auto;background:var(--sunk)}
.paper{background:var(--paper);color:var(--paper-fg);font-family:Arial,Helvetica,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:28px 26px;width:max-content;margin:0 auto}
.paper input{font-family:inherit;color:var(--ink);background:transparent;border:0;outline:none}
.paper input:focus{background:var(--paper-hover)}
.paper input::placeholder{color:var(--paper-soft);opacity:.6}
.paper .ink{color:var(--ink)}

/* lampenlijst */
table.lamp{border-collapse:collapse;font-size:15px}
table.lamp th{border:2px solid var(--paper-line);font-weight:400;padding:6px 8px;vertical-align:top;height:72px;text-align:center;line-height:1.35}
table.lamp th.c-dat{text-align:left;width:190px}
table.lamp th .n{display:block;margin-top:14px}
table.lamp td{border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);border-left:2px solid var(--paper-line);border-right:2px solid var(--paper-line);height:36px;padding:0;position:relative}
table.lamp td.c-num{width:130px}
table.lamp td input{width:100%;height:36px;padding:0 10px;font-size:20px;font-variant-numeric:tabular-nums}
table.lamp td.c-dat .dtxt{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:20px;color:var(--ink);pointer-events:none;white-space:nowrap}
table.lamp td.c-dat .dtxt .ph{color:var(--paper-soft);opacity:.6;font-size:15px}
table.lamp td.c-dat input{opacity:0;cursor:pointer}
table.lamp td.c-dat:focus-within{background:var(--paper-hover)}
table.lamp .l24{display:flex;align-items:center;height:36px}
table.lamp .l24 input{flex:1;min-width:0}
table.lamp .l24 .xbtn{width:34px;flex:0 0 34px;border-left:1px dashed var(--paper-soft)!important}
table.lamp .xbtn[aria-pressed="false"]{color:var(--paper-soft);opacity:.45;font-size:16px}
table.lamp .xbtn{width:100%;height:36px;border:0;background:transparent;font-size:22px;color:var(--ink);cursor:pointer;font-family:inherit}
table.lamp .xbtn:hover{background:var(--paper-hover)}
table.lamp .pct{display:flex;align-items:center;height:36px;padding-right:10px}
table.lamp .pct span{font-size:20px;color:var(--ink)}
table.lamp .pct input{text-align:right;padding-right:2px}
table.lamp tr.leeg td{border-top-color:var(--paper-line)}
table.lamp td.act{border:0;padding-left:6px;white-space:nowrap;width:1%}
table.lamp td.act button{border:0;background:none;color:var(--paper-soft);font-size:18px;cursor:pointer;padding:4px 6px;border-radius:4px;font-family:inherit}
table.lamp td.act button:hover{color:var(--ink-bad);background:var(--paper-hover)}
table.lamp td.act .cf{font-size:13px;color:var(--paper-fg)}
table.lamp td.act .cf button{font-size:13px;color:var(--ink-bad);font-weight:700}

/* registratieblad */
.reg{font-size:15px}
#regLayout{grid-template-columns:210px minmax(0,1fr)}
@media (max-width:760px){#regLayout{grid-template-columns:minmax(0,1fr)}}
#regLayout .paper-wrap{padding:12px}
.paper.reg{padding:22px 18px}
.reg-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:24px;align-items:start}
.reg-logo .emb{width:86px;height:86px;background:#111;display:grid;place-items:center}
.reg-logo .emb img{width:44px;height:auto}
.reg-logo span{display:block;width:86px;text-align:center;font-size:14px;margin-top:4px;letter-spacing:.02em}
.reg-title b{display:block;font-size:17px}
.reg-title .kl{margin-top:30px;display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:17px}
.reg-title .kl input{font-weight:700;font-size:18px;width:90px;border-bottom:1px solid var(--paper-soft)}
.reg-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:16px;color:#333}
.reg-meta .gap{grid-column:1/-1;height:22px}
.reg-meta .full{grid-column:1/-1}
.reg-sub{display:flex;gap:40px;margin-top:10px;font-size:16px;color:#333;align-items:baseline;flex-wrap:wrap}
.reg-sub label{display:flex;gap:8px;align-items:baseline}
.reg-sub input{font-size:18px;border-bottom:1px solid var(--paper-soft);padding:2px 4px}
.reg-sub input[type=date]{font-size:16px}
.meet{margin-top:26px;display:grid;grid-template-columns:auto 215px;align-items:end}
.meet-tijd{font-style:italic;font-size:16px;display:flex;align-items:baseline;gap:10px;padding:0 0 6px 4px}
.meet-tijd input{font-style:normal;font-size:17px;border-bottom:1px solid var(--paper-soft)}
.meet-charge{display:flex;align-items:center;gap:14px;justify-content:flex-end;font-size:16px;padding-bottom:6px}
.meet-charge input{border:1.5px solid var(--paper-line);width:150px;height:28px;padding:0 6px;font-size:17px}
table.scale{border-collapse:collapse;border:2px solid var(--paper-line);align-self:start}
table.scale td{padding:0;text-align:center;width:40px;height:30px;font-size:16px;white-space:nowrap}
table.scale td.side{width:40px}
table.scale tr.vw td{height:40px;text-align:left;padding:4px 8px;border-top:1px dashed #C9CED6}
.vwr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vwr label{font-size:14px;color:#444}
.vwr .vin{width:100px;height:30px;border:1.5px solid var(--paper-line)!important;border-radius:4px;padding:0 8px;font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.vwr .vin.uit{border-color:var(--ink-bad)!important;color:var(--ink-bad)}
.vst{font-size:12px;color:var(--paper-soft)}
.vst.uit{color:var(--ink-bad);font-weight:700}
.slw{position:relative;height:42px;margin:0 20px}
.sld{-webkit-appearance:none;appearance:none;position:absolute;left:-10px;width:calc(100% + 20px);top:2px;height:20px;margin:0;background:transparent;cursor:pointer}
.sld::-webkit-slider-runnable-track{height:4px;background:#C9CED6;border-radius:2px}
.sld::-moz-range-track{height:4px;background:#C9CED6;border-radius:2px}
.sld::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 0 0 1px var(--ink);margin-top:-8px}
.sld::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 0 0 1px var(--ink)}
.sld.leeg::-webkit-slider-thumb{background:#fff;box-shadow:0 0 0 1px var(--paper-soft)}
.sld.leeg::-moz-range-thumb{background:#fff;box-shadow:0 0 0 1px var(--paper-soft)}
.sld.uit::-webkit-slider-thumb{background:var(--ink-bad);box-shadow:0 0 0 1px var(--ink-bad)}
.sld.uit::-moz-range-thumb{background:var(--ink-bad);box-shadow:0 0 0 1px var(--ink-bad)}
.bub{position:absolute;top:23px;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:2px}
.bub.uit{color:var(--ink-bad)}
.bub button{border:0;background:none;color:var(--paper-soft);font-size:14px;cursor:pointer;padding:0 3px;font-family:inherit}
.bub button:hover{color:var(--ink-bad)}
.bub .ph{font-weight:400;color:var(--paper-soft);font-size:12px}
.meet-side .gl .hoek{display:inline;width:38px;font-size:16px;border-bottom:1px solid var(--paper-soft);height:auto;padding:0 2px;margin:0;text-align:center}
table.scale td.nm{text-align:left;padding-left:6px}
table.scale td.nm.r{text-align:right;padding-right:10px}
table.scale tr.top td{border-top:2px solid var(--paper-line);vertical-align:bottom}
table.scale td.g{border-left:2px solid var(--paper-line)}
table.scale td.side-l{text-align:right}
table.scale td.side-r{text-align:left}
.dg{width:32px;height:26px;border:2px solid transparent;border-radius:50%;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.dg:hover{background:var(--paper-hover)}

.ch2{display:flex;flex-direction:column;gap:6px}

.modal-box .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.list .score.open{background:var(--warn-soft);color:var(--warn)}
.advies{display:flex;flex-direction:column;gap:10px}
.adv-scroll{overflow-x:auto}
.adv-tbl{width:100%;border-collapse:collapse;font-size:14px}
.adv-tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.adv-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.adv-tbl td.num{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:16px}
.adv-warn{color:var(--warn);font-size:12px;margin-top:2px}
.adv-basis{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
.adv-sub{font-size:13px;font-weight:600;margin-top:4px}
.adv-dagen{display:flex;flex-wrap:wrap;gap:6px}
.adv-dagen button{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.adv-dagen button:hover{border-color:var(--accent)}
.adv-tips{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px;max-width:75ch}
.adv-leeg{margin:0;font-size:14px;color:var(--muted);max-width:70ch}
.tev{display:flex;flex-direction:column;gap:4px;max-width:560px}
.tev input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.tev input.leeg{opacity:.4}
.tev-lbl{position:relative;height:34px;margin:0 8px;font-size:12px;color:var(--muted);line-height:1.3}
.tev-lbl span{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
.tev-out{font-size:15px;font-weight:600}
.tev-out.s1,.tev-out.s2{color:var(--danger)}.tev-out.s4,.tev-out.s5{color:var(--accent)}
.list .score{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.list .score.s4,.list .score.s5{background:var(--accent-soft);color:var(--accent)}
.list .score.s1,.list .score.s2{background:var(--danger-soft);color:var(--danger)}

mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

@media (max-width:1100px){.mat-grid.vier{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.mat-grid.vier{grid-template-columns:repeat(2,minmax(0,1fr))}}

.mat-card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mat-nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.mat-card .hint{font-family:var(--f-body)}
.maandkiezer{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:4px;padding:10px 8px;border-bottom:1px solid var(--line)}

.maandkiezer select{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:0 4px;text-transform:capitalize;min-width:0}
.mat-ch{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px}
.mat-ch label{font-size:12px;color:var(--muted)}
.mat-grid.een{grid-template-columns:minmax(0,1fr)}
.mat-card.lak{gap:10px}
.mc-head{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:11px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mc-head span:first-child{grid-column:2}
.mc-row{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.mc-lbl{font-weight:600;font-size:14px}
.mc-row .inp input{font-family:var(--f-mono);font-size:16px;padding:9px 10px}
.mc-tot{font-family:var(--f-body)}
@media (max-width:520px){.mc-row,.mc-head{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);gap:6px}}
.mat-c2{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.mat-ch .ch2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat-ch .inp input{font-family:var(--f-mono);font-size:15px;padding:6px 10px}
.mat-tot .chg{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.mat-tot{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.mat-tot-h{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.mat-tot-h span{font-weight:400;color:var(--muted);text-transform:none}
.mat-tot dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.mat-tot dt{color:var(--muted)}
.mat-tot dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.err{color:var(--danger);font-size:14px}

@keyframes slideLeft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

header.top{position:relative;overflow:hidden}

header.top::after{content:"";position:absolute;top:0;bottom:0;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.15) 70%,transparent);transform:translateX(-150%) skewX(-20deg);animation:glint 6s 1s ease-in-out infinite!important;z-index:1;pointer-events:none}
.brand-logo{animation:slideLeft .6s ease-out both}
.brand{animation:slideLeft .6s .12s ease-out both}
.wrap>*{animation:fadeUp .6s ease-out both}

.btn,.tabs button,.linkbtn,.list li button,.stepper button,.st-kop{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s}
.btn:active:not(:disabled),.tabs button:active,.stepper button:active,.st-thumb:active{transform:scale(.95)}
.btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.tabs button[aria-selected="true"]{animation:popIn .3s ease-out}
input,textarea,select,.inp{transition:border-color .18s,box-shadow .18s,background-color .18s}
.st-item,.mat-card{transition:box-shadow .2s,transform .2s,border-color .2s}
.st-item:hover,.mat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.st-item.open{box-shadow:0 6px 20px rgba(0,0,0,.10)}
.st-body{animation:slideDown .28s ease-out both}
.st-form{animation:slideDown .3s ease-out both}
.status{transition:background-color .25s,color .25s}
.status.saved{animation:popIn .35s ease-out}

.modal{animation:fadeIn .2s ease-out both}
.modal-box{animation:popIn .32s ease-out both}
.lightbox img{animation:popIn .3s ease-out both}
.err{animation:slideDown .25s ease-out both}
.st-thumb{transition:transform .15s}
.anim-in .list li,.anim-in .st-item,.anim-in .mat-card,.anim-in .section,.anim-in .wals,.anim-in .sheet,.anim-in .paper{animation:fadeUp .55s ease-out both}
.anim-in .list li:nth-child(2),.anim-in .st-item:nth-child(2),.anim-in .mat-card:nth-child(2),.anim-in .section:nth-child(2),.anim-in .wals:nth-child(2){animation-delay:.04s}
.anim-in .list li:nth-child(3),.anim-in .st-item:nth-child(3),.anim-in .mat-card:nth-child(3),.anim-in .section:nth-child(3),.anim-in .wals:nth-child(3){animation-delay:.08s}
.anim-in .list li:nth-child(4),.anim-in .st-item:nth-child(4),.anim-in .mat-card:nth-child(4),.anim-in .section:nth-child(4),.anim-in .wals:nth-child(4){animation-delay:.12s}
.anim-in .list li:nth-child(5),.anim-in .st-item:nth-child(5),.anim-in .mat-card:nth-child(5),.anim-in .section:nth-child(5),.anim-in .wals:nth-child(5){animation-delay:.16s}
.anim-in .list li:nth-child(n+6),.anim-in .st-item:nth-child(n+6),.anim-in .mat-card:nth-child(n+6),.anim-in .section:nth-child(n+6),.anim-in .wals:nth-child(n+6){animation-delay:.2s}
.modal-box.check{border-top-color:var(--accent)}
.ck-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ck-list label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px;transition:background-color .18s,border-color .18s}

<div class="wrap">

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const VELDEN = ["stand","eind","hoogte","hoogteEind"];
const BEGIN_VAN = {eind:"stand",hoogteEind:"hoogte"};
const DAGEN = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MND = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseDate(s){const [y,m,d]=(s||"").split("-").map(Number);return y?new Date(y,m-1,d):null}
function longDate(s){const d=parseDate(s);return d?`${DAGEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]} ${d.getFullYear()}`:"Geen datum"}
function shortDate(s){const d=parseDate(s);return d?`${d.getDate()} ${MND[d.getMonth()]} ${d.getFullYear()}`:"—"}
function num(v){if(v===""||v==null)return null;const n=Number(String(v).replace(",",".").trim());return isFinite(n)?n:null}
function fmt(n){return n==null?"":String(Math.round(n*100)/100).replace(".",",")}
function uid(){return "w"+Math.random().toString(36).slice(2,8)}

// ---- state
let db=null, dbReady=false;
let walsen=[];            // [{id,naam}]
let walsenLoaded=false;
let dagen=[];             // [{id, ...data}]
let dagenLoaded=false;
let selectedId=null;      // id of record, or "__new"
let draft=null;           // editable copy
let dirty=false, saving=false, justSaved=false, confirmDel=false, error="";
let mode="dag";           // "dag" | "setup"
let setupDraft=null;

// ---- beoordelingen (schuifjes 1-5)
const BEOORDELINGEN=[
  {k:"tevredenheid",id:"f-tev",titel:"Tevredenheid: hoe is de lakdag verlopen?",lo:"slechte dag",hi:"perfecte dag",leeg:"Nog niet ingevuld. Schuif om de dag te beoordelen.",txt:["","Slechte dag","Matige dag","Gemiddelde dag","Goede dag","Perfecte dag"]},
  {k:"slotgaten",id:"f-slot",titel:"Terugkoppeling kwaliteit afdeling slotgaten",lo:"slecht",hi:"perfect",leeg:"Nog niet ingevuld. Vul in zodra de afdeling slotgaten terugkoppeling heeft gegeven.",txt:["","Slecht","Matig","Gemiddeld","Goed","Perfect"],opm:"slotOpmerking"}];
function beoordelingHtml(b){const v=draft[b.k];return `
    <div class="section">
      <h3><label for="${b.id}" style="all:inherit">${b.titel}</label>${v!=null?`<button class="link" type="button" id="${b.id}-clear">Wissen</button>`:""}</h3>
      <div class="tev">
        <span class="tev-out ${v!=null?"s"+v:""}" id="${b.id}-out">${v!=null?v+" van 5 · "+b.txt[v]:b.leeg}</span>
        <input type="range" id="${b.id}" min="1" max="5" step="1" value="${v??3}" class="${v==null?"leeg":""}" aria-valuetext="${v!=null?v+" van 5":"niet ingevuld"}">
        <div class="tev-lbl"><span style="left:0;transform:none;text-align:left">1<br>${b.lo}</span><span style="left:25%">2</span><span style="left:50%">3</span><span style="left:75%">4</span><span style="right:0;left:auto;transform:none;text-align:right">5<br>${b.hi}</span></div>
      </div>
      ${b.opm?`<div class="field" style="margin-top:6px"><label for="${b.id}-opm">Opmerkingen slotgaten</label><textarea id="${b.id}-opm" data-opm="${b.opm}" style="min-height:90px" placeholder="Wat was er goed of mis? Bijv. lak in de slotgaten, ruwe randen, kleurverschil…">${esc(draft[b.opm]||"")}</textarea></div>`:""}
    </div>
`}
// ---- foto's bij lakdag
function ldTouch(){if(!dirty){dirty=true;justSaved=false}refreshHead()}
function renderLdFotos(){const box=$("#ldFotos");if(!box||!draft)return;
  if(draft.fotos==null){box.innerHTML='<span class="hint">Foto\'s laden…</span>';const d=draft;laadFotos(d.fotoIds).then(f=>{d.fotos=f;if(draft===d)renderLdFotos()});return}
  box.innerHTML=draft.fotos.map((f,i)=>`<div class="st-thumb edit"><img src="${f.data}" alt="Foto ${i+1}" data-groot="${i}"><button type="button" class="st-fx" data-weg="${i}" aria-label="Foto ${i+1} verwijderen">×</button></div>`).join("")
    +(draft.fotoBezig?'<span class="hint">Foto verwerken…</span>':"")
    +(draft.fotos.length<MAX_FOTOS?'<label class="st-add" for="ld-cam">Foto maken<br><span>camera</span></label><label class="st-add" for="ld-file">Foto kiezen<br><span>uit galerij</span></label>':"");
  box.querySelectorAll("[data-weg]").forEach(b=>b.onclick=()=>{draft.fotos.splice(+b.dataset.weg,1);ldTouch();renderLdFotos()});
  box.querySelectorAll("[data-groot]").forEach(im=>im.onclick=()=>toonFoto(im.src));
}
// ---- charges (per laksoort twee chargenummers)
const CH_K=["primer","primer2","grondlak","grondlak2","deklak","deklak2"];
function chObj(src,trim){const o={};CH_K.forEach(k=>{const v=(src&&src[k])||"";o[k]=trim?String(v).trim():v});return o}
function chHas(c){return !!c&&CH_K.some(k=>(c[k]||"").trim())}
function chTekst(c,k){return [c&&c[k],c&&c[k+"2"]].map(x=>(x||"").trim()).filter(Boolean).join(" + ")}
// ---- draft handling
function blankDraft(){
  return {id:null,datum:today(),temperatuur:null,luchtvochtigheid:null,walsen:{},bijzonderheden:"",tevredenheid:null,slotgaten:null,slotOpmerking:"",charge:chObj({}),fotos:[],fotoIds:[]};
}
function draftFrom(rec){
  const w={};(rec.walsen||[]).forEach(x=>{const o={naam:x.naam};VELDEN.forEach(f=>{if(x[f]!=null)o[f]=x[f]});w[x.id]=o});
  return {id:rec.id,datum:rec.datum||"",temperatuur:rec.temperatuur??null,luchtvochtigheid:rec.luchtvochtigheid??null,walsen:w,bijzonderheden:rec.bijzonderheden||"",tevredenheid:rec.tevredenheid??null,slotgaten:rec.slotgaten??null,fotos:(rec.fotos&&rec.fotos.length)?null:[],fotoIds:rec.fotos||[],slotOpmerking:rec.slotOpmerking||"",charge:chObj(rec.charge)};
}
function sorted(){return dagen.slice().sort((a,b)=>(b.datum||"").localeCompare(a.datum||"")||(b.bijgewerkt||0)-(a.bijgewerkt||0))}
function previousOf(d){
  // meest recente lakdag vóór de datum van dit blad (anders dan zichzelf)
  const s=sorted().filter(r=>r.id!==d.id && (r.datum||"")<= (d.datum||"9999") );
  return s.find(r=>r.datum<d.datum) || s[0] || null;
}

function select(id){
  if(dirty && !window.__skipDirty){ if(!confirmLeave())return; }
  mode="dag"; confirmDel=false; error=""; justSaved=false;
  selectedId=id;
  const rec=dagen.find(r=>r.id===id);
  draft=rec?draftFrom(rec):blankDraft();
  dirty=false;
  render();
}
let leaveArmed=false;
function confirmLeave(){
  // eerste klik: waarschuwen; tweede klik: toch verlaten
  if(leaveArmed){leaveArmed=false;return true}
  leaveArmed=true; error="Je hebt niet-opgeslagen wijzigingen. Klik nog eens om ze te laten vallen, of sla eerst op.";
  renderSheet(); setTimeout(()=>{leaveArmed=false},6000);
  return false;
}
// ===================== CHECKLIST NIEUWE LAKDAG =====================
const CHECKLIST=["Zijn alle schuurbanden vervangen?","Zijn alle schuurzolen vervangen?","Is alle lak bijgevuld?","Staan de walsen in de correcte stand?"];
function startChecklist(){
  if(dirty && !confirmLeave())return;
  const m=$("#modal");
  m.innerHTML=`<div class="modal-box check" role="dialog" aria-modal="true" aria-labelledby="ckT">
    <h2 id="ckT">Checklist voor de start</h2>
    <p>Vink alles af voordat je de nieuwe lakdag begint.</p>
    <ul class="ck-list">${CHECKLIST.map((t,i)=>`<li><label><input type="checkbox" data-ck="${i}"><span>${esc(t)}</span></label></li>`).join("")}</ul>
    <span class="ck-tel" id="ckTel">0 van ${CHECKLIST.length} afgevinkt</span>
    <div class="row"><button class="btn primary" type="button" id="ckGo" disabled>Lakdag starten</button><button class="btn" type="button" id="ckNee">Annuleren</button></div>
  </div>`;
  m.hidden=false;
  const sluit=()=>{m.hidden=true;m.innerHTML=""};
  const boxes=[...m.querySelectorAll("[data-ck]")];
  boxes.forEach(b=>b.onchange=()=>{const n=boxes.filter(x=>x.checked).length;$("#ckTel").textContent=`${n} van ${CHECKLIST.length} afgevinkt`;$("#ckGo").disabled=n<CHECKLIST.length});
  $("#ckNee").onclick=sluit;m.onclick=e=>{if(e.target===m)sluit()};
  $("#ckGo").onclick=()=>{sluit();dirty=false;newDay()};
  boxes[0].focus();
}
function newDay(){
  if(dirty && !confirmLeave())return;
  mode="dag"; selectedId="__new"; confirmDel=false; error=""; justSaved=false;
  draft=blankDraft();
  const mt=matRows.find(m=>m.datum===draft.datum&&chHas(m.charge));if(mt)draft.charge=chObj(mt.charge);
  // standen van vorige lakdag voorinvullen
  const prev=sorted()[0];
  if(prev){(prev.walsen||[]).forEach(x=>{const o={naam:x.naam};if(x.stand!=null)o.stand=x.stand;if(x.hoogte!=null)o.hoogte=x.hoogte;if(o.stand!=null||o.hoogte!=null)draft.walsen[x.id]=o})}
  dirty=true; render();
}

// ---- rendering
function render(){renderList();renderSheet()}

function renderList(){
  const ul=$("#list");
  $("#count").textContent=dagenLoaded?String(dagen.length):"–";
  if(!dagenLoaded){ul.innerHTML='<li class="empty">Laden…</li>';return}
  const rows=sorted();
  let html="";
  if(selectedId==="__new") html+=`<li><button type="button" aria-current="true"><span><span class="d">Nieuwe lakdag</span><br><span class="wd">nog niet opgeslagen</span></span><span class="cond"></span></button></li>`;
  if(!rows.length && selectedId!=="__new") html+='<li class="empty">Nog geen lakdagen. Klik op <b>+ Nieuwe lakdag</b> om de eerste in te vullen.</li>';
  for(const r of rows){
    const d=parseDate(r.datum);
    const c=[r.temperatuur!=null?fmt(r.temperatuur)+"°C":null,r.luchtvochtigheid!=null?fmt(r.luchtvochtigheid)+"%":null].filter(Boolean).join(" · ");
    html+=`<li><button type="button" data-id="${esc(r.id)}" aria-current="${r.id===selectedId}">
      <span><span class="d">${esc(shortDate(r.datum))}</span><br><span class="wd">${d?DAGEN[d.getDay()]:""}</span></span>
      <span class="cond">${esc(c)}</span>
      ${r.tevredenheid!=null||slotOpen(r)||(r.bijzonderheden&&r.bijzonderheden.trim())?`<span class="flag">${r.tevredenheid!=null?`<span class="score s${r.tevredenheid}">${r.tevredenheid}/5</span> `:""}${slotOpen(r)?'<span class="score open">slotgaten open</span> ':""}${r.bijzonderheden&&r.bijzonderheden.trim()?"● bijzonderheden":""}</span>`:""}
    </button></li>`;
  }
  ul.innerHTML=html;
  ul.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>select(b.dataset.id));
}

function statusPill(){
  if(saving)return '<span class="status">Opslaan…</span>';
  if(dirty)return '<span class="status dirty">Niet opgeslagen</span>';
  if(justSaved)return '<span class="status saved">Opgeslagen</span>';
  return "";
}

function renderSheet(){
  const el=$("#sheet");
  if(mode==="setup")return renderSetup(el);
  if(mode==="users")return renderUsers(el);
  if(!draft){
    const first=dagenLoaded&&!dagen.length;
    el.innerHTML=first
      ? `<div class="blank"><strong>Welkom bij het logboek</strong><span>Stel eerst de walsen van de lakstraat in (namen en volgorde). Daarna vul je per lakdag de standen en hoogtes, temperatuur, luchtvochtigheid en bijzonderheden in.</span><div class="top-actions"><button class="btn" type="button" id="blankSetup">Walsen instellen</button><button class="btn primary" type="button" id="blankNew">+ Nieuwe lakdag</button></div></div>`
      : `<div class="blank"><strong>${dagenLoaded?"Kies een lakdag":"Laden…"}</strong><span>Selecteer links een dag, of begin een nieuw blad.</span><button class="btn primary" type="button" id="blankNew">+ Nieuwe lakdag</button></div>`;
    $("#blankNew").onclick=startChecklist; const bs=$("#blankSetup"); if(bs)bs.onclick=openSetup; return;
  }
  const rows=sorted();
  const idx=rows.findIndex(r=>r.id===draft.id);
  const prev=previousOf(draft);
  const prevW={};(prev?.walsen||[]).forEach(x=>prevW[x.id]=x);

  // walsen: huidige configuratie + walsen die alleen in dit record staan
  const list=walsen.map(w=>({id:w.id,naam:w.naam,gone:false}));
  Object.keys(draft.walsen).forEach(id=>{if(!list.find(w=>w.id===id))list.push({id,naam:draft.walsen[id].naam||"Wals",gone:true})});

  let wHtml="";
  if(!list.length){
    wHtml=`<div class="blank" style="padding:18px"><span>Er zijn nog geen walsen ingesteld.</span><button class="btn" type="button" id="goSetup">Walsen instellen</button></div>`;
  } else {
    wHtml='<div class="walsen">'+list.map((w,i)=>{
      const val=f=>draft.walsen[w.id]?.[f];
      const cell=(f,lab,kind,cls)=>`<div class="cell">
          <span class="lbl">${lab}</span>
          <div class="stepper ${cls}">
            <button type="button" data-step="-1" data-f="${f}" data-w="${esc(w.id)}" aria-label="${kind} ${lab.toLowerCase()} ${esc(w.naam)} lager">−</button>
            <input id="w-${f}-${esc(w.id)}" data-f="${f}" data-w="${esc(w.id)}" data-naam="${esc(w.naam)}" inputmode="decimal" autocomplete="off" value="${esc(fmt(val(f)))}" placeholder="—" aria-label="${kind} ${lab.toLowerCase()} ${esc(w.naam)}">
            <button type="button" data-step="1" data-f="${f}" data-w="${esc(w.id)}" aria-label="${kind} ${lab.toLowerCase()} ${esc(w.naam)} hoger">+</button>
          </div>
          <span class="delta" data-d="${f}"></span>
        </div>`;
      return `<div class="wals ${w.gone?"gone":""}" data-card="${esc(w.id)}">
        <div class="nm"><b>${esc(w.naam)}</b><span class="no">${w.gone?"niet meer in gebruik":"#"+(i+1)}</span></div>
        <div class="grp-t">Stand</div>
        <div class="pair">${cell("stand","Begin","Stand","")}${cell("eind","Eind","Stand","eind")}</div>
        <div class="grp-t">Hoogte</div>
        <div class="pair">${cell("hoogte","Begin","Hoogte","")}${cell("hoogteEind","Eind","Hoogte","eind")}</div>
      </div>`}).join("")+'</div>';
  }

  const isNew=!draft.id;
  el.innerHTML=`
    <div class="sheet-head">
      <div>
        <div class="title">${esc(longDate(draft.datum))}</div>
        <div class="sub">${isNew?"Nieuw blad":`Blad ${rows.length-idx} van ${rows.length}`} ${statusPill()}</div>
      </div>
      <div class="nav">
        <button class="btn" type="button" id="navOlder" ${isNew||idx<0||idx>=rows.length-1?"disabled":""} aria-label="Oudere lakdag">← Ouder</button>
        <button class="btn" type="button" id="navNewer" ${isNew||idx<=0?"disabled":""} aria-label="Nieuwere lakdag">Nieuwer →</button>
      </div>
    </div>

    <div class="section">
      <h3>Algemeen</h3>
      <div class="conds">
        <div class="field">
          <label for="f-datum">Datum lakken</label>
          <div class="inp"><input id="f-datum" type="date" value="${esc(draft.datum)}" style="font-size:16px"></div>
        </div>
        <div class="field">
          <label for="f-temp">Temperatuur</label>
          <div class="inp"><input id="f-temp" inputmode="decimal" autocomplete="off" placeholder="—" value="${esc(fmt(draft.temperatuur))}"><span class="unit">°C</span></div>
          <span class="hint">${prev&&prev.temperatuur!=null?"vorige: "+fmt(prev.temperatuur)+" °C":"&nbsp;"}</span>
        </div>
        <div class="field">
          <label for="f-rv">Luchtvochtigheid</label>
          <div class="inp"><input id="f-rv" inputmode="decimal" autocomplete="off" placeholder="—" value="${esc(fmt(draft.luchtvochtigheid))}"><span class="unit">% RV</span></div>
          <span class="hint">${prev&&prev.luchtvochtigheid!=null?"vorige: "+fmt(prev.luchtvochtigheid)+" %":"&nbsp;"}</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h3><span>Advies en analyse</span></h3>
      <div class="advies" id="advies"></div>
    </div>

    <div class="section">
      <h3><span>Walsen: stand en hoogte</span><button class="link" type="button" id="editWalsen">Walsen aanpassen</button></h3>
      ${wHtml}
    </div>

    <div class="section">
      <h3>Charge lakblikken</h3>
      <div class="charges">${[["primer","Primer"],["grondlak","Grondlak"],["deklak","Deklak"]].map(([k,n])=>`<div class="field"><label for="ch-${k}">${n}</label><div class="ch2"><div class="inp"><input id="ch-${k}" data-ch="${k}" autocomplete="off" value="${esc(draft.charge?.[k]||"")}" placeholder="charge 1" aria-label="${n} charge 1"></div><div class="inp"><input id="ch-${k}2" data-ch="${k}2" autocomplete="off" value="${esc(draft.charge?.[k+"2"]||"")}" placeholder="charge 2" aria-label="${n} charge 2"></div></div><span class="hint">${prev&&chTekst(prev.charge,k)?"vorige: "+esc(chTekst(prev.charge,k)):"&nbsp;"}</span></div>`).join("")}</div>
    </div>

    <div class="section">
      <h3><label for="f-bijz" style="all:inherit">Bijzonderheden</label></h3>
      <textarea id="f-bijz" placeholder="Bijv. storing, andere laksoort, nieuwe rol geplaatst, afwijkende houtsoort, klachten over de afwerking…">${esc(draft.bijzonderheden)}</textarea>
    </div>

${BEOORDELINGEN.map(b=>beoordelingHtml(b)).join("")}
    <div class="section">
      <h3>Foto's van deze lakdag <span style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">(maximaal ${MAX_FOTOS})</span></h3>
      <div class="st-fotos" id="ldFotos"></div>
      <input type="file" id="ld-cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="ld-file" accept="image/*" multiple hidden>
    </div>
    <div class="foot">
      <div class="grp">
        ${confirmDel
          ? `<span class="confirm">Dit blad verwijderen? <button class="btn danger-solid" type="button" id="delYes">Ja, verwijderen</button><button class="btn" type="button" id="delNo">Annuleren</button></span>`
          : (isNew?`<button class="btn danger" type="button" id="discard">Weggooien</button>`:`<button class="btn danger" type="button" id="del">Verwijderen</button>`)}
      </div>
      <div class="grp">
        ${error?`<span class="err">${esc(error)}</span>`:""}
        ${dirty&&!isNew?'<button class="btn" type="button" id="revert">Wijzigingen ongedaan maken</button>':""}
        <button class="btn primary" type="button" id="save" ${saving||(!dirty)?"disabled":""}>Opslaan</button>
      </div>
    </div>`;

  // wiring
  const touch=()=>{if(!dirty){dirty=true;justSaved=false;refreshHead()} else refreshHead();renderAdvies()};
  BEOORDELINGEN.forEach(b=>{const inp=$("#"+b.id);
    const setV=v=>{draft[b.k]=v;inp.classList.toggle("leeg",v==null);const o=$("#"+b.id+"-out");o.className="tev-out"+(v!=null?" s"+v:"");o.textContent=v!=null?v+" van 5 · "+b.txt[v]:b.leeg;inp.setAttribute("aria-valuetext",v!=null?v+" van 5":"niet ingevuld");touch()};
    inp.oninput=()=>setV(Number(inp.value));
    inp.onpointerdown=()=>{if(draft[b.k]==null)setTimeout(()=>setV(Number(inp.value)),0)};
    const c=$("#"+b.id+"-clear");if(c)c.onclick=()=>{setV(null);renderSheet()};
    const t=$("#"+b.id+"-opm");if(t)t.oninput=()=>{draft[b.opm]=t.value;touch()};
  });
  $("#f-datum").onchange=e=>{draft.datum=e.target.value;
    const leeg=!chHas(draft.charge);
    const mt=matRows.find(m=>m.datum===draft.datum&&chHas(m.charge));
    if(leeg&&mt)draft.charge=chObj(mt.charge);
    touch();renderSheetKeepFocus("f-datum")};
  $("#f-temp").oninput=e=>{draft.temperatuur=num(e.target.value);touch()};
  $("#f-rv").oninput=e=>{draft.luchtvochtigheid=num(e.target.value);touch()};
  $("#f-bijz").oninput=e=>{draft.bijzonderheden=e.target.value;touch()};
  el.querySelectorAll("[data-ch]").forEach(inp=>inp.oninput=()=>{if(!draft.charge)draft.charge={};draft.charge[inp.dataset.ch]=inp.value;touch()});
  function setVal(id,f,v,naam){
    const cur=draft.walsen[id]||{naam};
    cur.naam=naam; if(v==null)delete cur[f]; else cur[f]=v;
    if(VELDEN.every(f=>cur[f]==null))delete draft.walsen[id]; else draft.walsen[id]=cur;
  }
  el.querySelectorAll(".stepper input").forEach(inp=>{
    inp.oninput=()=>{const id=inp.dataset.w,f=inp.dataset.f;const v=num(inp.value);
      if(v==null && inp.value.trim()==="")setVal(id,f,null,inp.dataset.naam); else if(v!=null) setVal(id,f,v,inp.dataset.naam);
      touch(); updateDelta(id)};
    inp.onblur=()=>{inp.value=fmt(draft.walsen[inp.dataset.w]?.[inp.dataset.f])};
  });
  el.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.w, f=b.dataset.f, inp=el.querySelector(`input[data-w="${CSS.escape(id)}"][data-f="${f}"]`);
    const w=draft.walsen[id]||{};
    const b=BEGIN_VAN[f]||f; const cur=w[f] ?? (BEGIN_VAN[f]?w[b]:null) ?? prevW[id]?.[b] ?? 0;
    const v=Math.round((cur+Number(b.dataset.step)*stepFor(cur))*100)/100;
    setVal(id,f,v,inp.dataset.naam); inp.value=fmt(v); touch(); updateDelta(id);
  });
  function updateDelta(id){
    const card=el.querySelector(`[data-card="${CSS.escape(id)}"]`); if(!card)return;
    const w=draft.walsen[id]||{};
    const pw=prevW[id]||{};
    for(const [bf,ef] of [["stand","eind"],["hoogte","hoogteEind"]]){
      const bs=card.querySelector(`[data-d="${bf}"]`), be=card.querySelector(`[data-d="${ef}"]`);
      const p=pw[bf], v=w[bf], e=w[ef];
      if(prev&&p!=null){const chg=v!=null&&Math.abs(v-p)>1e-9;
        bs.className="delta"+(chg?" chg":""); bs.textContent=`vorige: ${fmt(p)}${chg?` · ${v>p?"+":"−"}${fmt(Math.abs(v-p))}`:""}`;
      } else bs.innerHTML="&nbsp;";
      if(v!=null&&e!=null){const d=e-v;const chg=Math.abs(d)>1e-9;

// ---- persistence
function toRecord(){
  const ws=[];
  const order=walsen.map(w=>w.id);
  const ids=Object.keys(draft.walsen).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)});
  for(const id of ids){const x=draft.walsen[id];if(x&&VELDEN.some(f=>x[f]!=null)){const cfg=walsen.find(w=>w.id===id);const o={id,naam:cfg?cfg.naam:x.naam};VELDEN.forEach(f=>o[f]=x[f]??null);ws.push(o)}}
  return {datum:draft.datum,temperatuur:draft.temperatuur,luchtvochtigheid:draft.luchtvochtigheid,walsen:ws,bijzonderheden:draft.bijzonderheden||"",tevredenheid:draft.tevredenheid??null,slotgaten:draft.slotgaten??null,slotOpmerking:(draft.slotOpmerking||"").trim(),charge:chObj(draft.charge,true),bijgewerkt:Date.now()};
}
async function save(){
  if(!draft.datum){error="Vul een datum in.";renderSheet();return}
  error=""; saving=true; refreshHead();
  const rec=toRecord();
  try{
    if(db){
      if(draft.fotos!=null){const ids=[];
        for(const f of draft.fotos){if(!f.id){f.id=DOC_ID("foto_ld_");await db.collection("instellingen").doc(f.id).set({lakdag:draft.id||"",data:f.data,aangemaakt:Date.now()});fotoCache[f.id]=f.data}ids.push(f.id)}
        for(const fid of draft.fotoIds||[])if(!ids.includes(fid)){try{await db.collection("instellingen").doc(fid).delete()}catch(x){}delete fotoCache[fid]}
        rec.fotos=ids;draft.fotoIds=ids}
      else rec.fotos=draft.fotoIds||[];
      const ref=draft.id?db.collection("lakdagen").doc(draft.id):db.collection("lakdagen").doc();
      await ref.set(rec);
      draft.id=ref.id; selectedId=ref.id;
      if(!dagen.find(r=>r.id===ref.id))dagen.push({id:ref.id,...rec}); else dagen=dagen.map(r=>r.id===ref.id?{id:ref.id,...rec}:r);
    } else {
      const id=draft.id||("local-"+Date.now());
      draft.id=id; selectedId=id;
      dagen=dagen.filter(r=>r.id!==id).concat([{id,...rec}]);
    }
    dirty=false; justSaved=true;
  }catch(e){
    error=e&&e.code==="quota_exceeded"?"De opslag is vol. Verwijder oude bladen en probeer opnieuw.":
          e&&e.code==="invalid_argument"?"Je hebt geen rechten om hier op te slaan.":"Opslaan mislukt. Controleer de verbinding en probeer opnieuw.";
  }
  saving=false; render();
}
async function removeDay(){
  if(!draft.id){draft=null;selectedId=null;dirty=false;confirmDel=false;const f=sorted()[0];if(f){select(f.id)}else render();return}
  const id=draft.id;
  try{ if(db) await (async()=>{const oud=dagen.find(x=>x.id===id);for(const fid of (oud&&oud.fotos)||[]){try{await db.collection("instellingen").doc(fid).delete()}catch(x){}}})(),await db.collection("lakdagen").doc(id).delete(); }
  catch(e){error="Verwijderen mislukt. Probeer het opnieuw.";confirmDel=false;renderSheet();return}
  dagen=dagen.filter(r=>r.id!==id); dirty=false; confirmDel=false;
  const f=sorted()[0]; if(f){selectedId=null;select(f.id)} else {draft=null;selectedId=null;render()}
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){ // files: [{name, text}] -> Uint8Array (zip zonder compressie)
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(head,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=head.length+name.length+data.length;
  }
  const cdSize=central.reduce((s,p)=>s+p.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end], out=new Uint8Array(all.reduce((s,p)=>s+p.length,0)); let p=0; for(const a of all){out.set(a,p);p+=a.length} return out;
}
const X=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function analyse(cur){

  const goed=rated.filter(d=>d.tevredenheid>=4), slecht=rated.filter(d=>d.tevredenheid<=2);
  const T=cur.temperatuur,H=cur.luchtvochtigheid,metWeer=T!=null||H!=null;
  const kand=goed.map(d=>({d,s:gelijkenis(d,T,H)})).sort((a,b)=>metWeer?(b.s-a.s||b.d.tevredenheid-a.d.tevredenheid):(b.d.datum||"").localeCompare(a.d.datum||""));
  const basis=kand.slice(0,5).map(x=>x.d);
  const adv={};
  for(const w of walsen){adv[w.id]={};
    for(const f of ["stand","hoogte"]){
      let sw=0,sv=0,sv2=0,n=0;
      for(const d of basis){const x=(d.walsen||[]).find(x=>x.id===w.id);if(!x)continue;const v=gebruikt(x,f);if(v==null)continue;
        const wt=d.tevredenheid-3;if(wt<=0)continue;sw+=wt;sv+=wt*v;sv2+=wt*v*v;n++}
      if(sw>1e-6&&n){const m=sv/sw;adv[w.id][f]={v:r2(m),sd:Math.sqrt(Math.max(0,sv2/sw-m*m)),n}}
    }}

  const tips=[];
  if(rated.length>=3){
    tips.push(`Gemiddelde tevredenheid over ${rated.length} beoordeelde lakdagen: ${fmt1(avg(rated.map(d=>d.tevredenheid)))} van 5.`);
    const split=(key,eenheid,naam)=>{const xs=rated.filter(d=>d[key]!=null);if(xs.length<4)return;
      const vals=xs.map(d=>d[key]).sort((a,b)=>a-b),med=vals[Math.floor(vals.length/2)];
      const hoog=xs.filter(d=>d[key]>=med),laag=xs.filter(d=>d[key]<med);if(!hoog.length||!laag.length)return;
      const a=avg(hoog.map(d=>d.tevredenheid)),b=avg(laag.map(d=>d.tevredenheid));if(Math.abs(a-b)<0.6)return;
      tips.push(`Bij een ${naam} van ${fmt(med)}${eenheid} of hoger scoorde de dag gemiddeld ${fmt1(a)}, daaronder ${fmt1(b)}.`)};
    split("luchtvochtigheid"," %","luchtvochtigheid");split("temperatuur"," °C","temperatuur");

        const g=pick(goed),s=pick(slecht);if(!g.length||!s.length)continue;

      vs.sort((a,b)=>b.rel-a.rel).slice(0,3).forEach(x=>tips.push(x.t))}
    const chron=rated.slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    if(chron.length>=6){const l=avg(chron.slice(-3).map(d=>d.tevredenheid)),p=avg(chron.slice(-6,-3).map(d=>d.tevredenheid));
      if(l-p>=0.7)tips.push(`De laatste 3 lakdagen gingen beter (${fmt1(l)}) dan de 3 daarvoor (${fmt1(p)}).`);
      if(p-l>=0.7)tips.push(`De laatste 3 lakdagen gingen minder goed (${fmt1(l)}) dan de 3 daarvoor (${fmt1(p)}).`)}

  const pageIds=[];

  objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objs[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+" 0 R").join(" ")}] /Count ${pageIds.length} >>`;
  objs.forEach((o,i)=>{offs[i]=len;addS(`${i+1} 0 obj\n`);

async function saveStoring(){

      const fid=DOC_ID("foto_"+id.slice(5)+"_");await db.collection("instellingen").doc(fid).set({storing:id,data:f.data,aangemaakt:Date.now()});fotoCache[fid]=f.data;f.id=fid;ids.push(fid)}
    const oud=storingen.find(x=>x.id===id);
    for(const fid of (oud&&oud.fotos)||[])if(!ids.includes(fid)){try{await db.collection("instellingen").doc(fid).delete()}catch(x){}delete fotoCache[fid]}

let matRows=[],matLoaded=false,matSel=null,matDraft=null,matDirty=false,matSaving=false,matSaved=false,matErr="",matDel=false,matArmed=false;

function lakdagOp(datum){return datum?dagen.find(d=>d.datum===datum)||null:null}
function chargeVoor(r,k){const ld=lakdagOp(r.datum);const c=ld&&ld.charge&&ld.charge[k];return (c&&String(c).trim())||(r.charge&&r.charge[k])||""}
function chargesVoor(r){const o={};CH_K.forEach(k=>o[k]=chargeVoor(r,k));return o}
function perCharge(rows){const map={};
  const tel=(r,m,c,v)=>{const key=m.k+"|"+c;const o=map[key]||(map[key]={soort:m.naam,k:m.k,charge:c,blik:0,dagen:0,van:r.datum,tot:r.datum});o.blik+=v;o.dagen++;if(r.datum<o.van)o.van=r.datum;if(r.datum>o.tot)o.tot=r.datum};
  for(const r of rows)for(const m of MATS.filter(m=>m.groep==="lak")){const c1=chargeVoor(r,m.k),c2=chargeVoor(r,m.k+"2");
    if(r[m.k+"B"]!=null){if(r[m.k])tel(r,m,c1||"onbekend",r[m.k]);if(r[m.k+"B"])tel(r,m,c2||"charge 2 onbekend",r[m.k+"B"])}
    else{const v=r[m.k];if(!v)continue;tel(r,m,[c1,c2].filter(Boolean).join(" + ")||"onbekend",v)}}
  return Object.values(map).sort((a,b)=>LAK_K.indexOf(a.k)-LAK_K.indexOf(b.k)||(a.van||"").localeCompare(b.van||""))}
function matTot(r,k){return (r[k]||0)+(LAK_K.includes(k)?(r[k+"B"]||0):0)}
function matBlank(){const o={id:null,datum:today(),opmerking:"",chargeAangepast:false};MATS.forEach(m=>o[m.k]=null);LAK_K.forEach(k=>o[k+"B"]=null);o.charge=chargesVoor(o);return o}
function matFrom(r){const o={id:r.id,datum:r.datum||"",opmerking:r.opmerking||"",chargeAangepast:false};MATS.forEach(m=>o[m.k]=r[m.k]??null);LAK_K.forEach(k=>o[k+"B"]=r[k+"B"]??null);o.charge=chargesVoor(r);return o}

function matGuard(){if(!matDirty)return true;if(matArmed){matArmed=false;return true}matArmed=true;matErr="Je hebt niet-opgeslagen wijzigingen. Klik nog eens om ze weg te gooien, of sla eerst op.";renderMatSheet();setTimeout(()=>{matArmed=false},6000);return false}

      ${LAK_K.includes(m.k)?`<div class="mat-ch"><label for="mch-${m.k}">Charge</label><div class="ch2"><div class="inp"><input id="mch-${m.k}" data-ch="${m.k}" autocomplete="off" value="${esc(r.charge?.[m.k]||"")}" placeholder="charge 1" aria-label="${esc(m.naam)} charge 1"></div><div class="inp"><input id="mch-${m.k}2" data-ch="${m.k}2" autocomplete="off" value="${esc(r.charge?.[m.k+"2"]||"")}" placeholder="charge 2" aria-label="${esc(m.naam)} charge 2"></div></div></div>`:""}
    </div>`;
  el.innerHTML=`<div class="sheet-head"><div><div class="title">Materialen ${esc(r.datum?longDate(r.datum):"")}</div><div class="sub">${isNew?"Nieuwe dag":"Opgeslagen dag"} ${statusHtml(matSaving,matDirty,matSaved)}</div></div></div>
    <div class="section"><h3>Lakdag</h3>
      <div class="conds" style="grid-template-columns:minmax(0,260px)"><div class="field"><label for="mat-datum">Datum</label><div class="inp"><input id="mat-datum" type="date" value="${esc(r.datum)}" style="font-size:16px"></div>
      ${dubbel?'<span class="hint" style="color:var(--warn);font-family:var(--f-body)">Er is al een materialenblad voor deze datum.</span>':""}
      <span class="hint" style="font-family:var(--f-body)">${lakdagOp(r.datum)?"Charges komen uit de lakdag van deze datum. Pas je ze hier aan, dan wordt de lakdag ook bijgewerkt.":"Er is nog geen lakdag op deze datum. De charges worden bij dit materialenblad bewaard en komen mee als je de lakdag later aanmaakt."}</span></div></div></div>
    <div class="section"><h3>Lak</h3><div class="mat-grid een">${MATS.filter(m=>m.groep==="lak").map(kaart).join("")}</div></div>
    <div class="section"><h3>Verdunner</h3><div class="mat-grid drie">${MATS.filter(m=>m.groep==="verdunner").map(kaart).join("")}</div></div>
    <div class="section"><h3>Schuurpapier</h3><div class="mat-grid vier">${MATS.filter(m=>m.groep==="schuur").map(kaart).join("")}</div></div>
    <div class="section"><h3><label for="mat-opm" style="all:inherit">Opmerking</label></h3><textarea id="mat-opm" placeholder="Bijv. nieuwe batch lak geopend, blik deels gebruikt…" style="min-height:80px">${esc(r.opmerking)}</textarea></div>
    <div class="foot">
      <div class="grp">${matDel?`<span class="confirm">Deze dag ${isNew?"weggooien":"verwijderen"}? <button class="btn danger-solid" type="button" id="matDelYes">Ja</button><button class="btn" type="button" id="matDelNo">Annuleren</button></span>`:`<button class="btn danger" type="button" id="matDelBtn">${isNew?"Weggooien":"Verwijderen"}</button>`}</div>
      <div class="grp">${matErr?`<span class="err">${esc(matErr)}</span>`:""}<button class="btn primary" type="button" id="matSave" ${matSaving||!matDirty?"disabled":""}>Opslaan</button></div>
    </div>`;
  const touch=()=>{matDirty=true;matSaved=false;matErr="";const sub=el.querySelector(".sheet-head .sub");sub.innerHTML=sub.innerHTML.replace(/<span class="status[^"]*">[^<]*<\/span>/,"")+statusHtml(matSaving,matDirty,matSaved);const s=$("#matSave");if(s)s.disabled=false};
  const dt=$("#mat-datum");dt.onclick=()=>{try{dt.showPicker()}catch(e){}};dt.onchange=()=>{r.datum=dt.value;if(!r.chargeAangepast)r.charge=chargesVoor({datum:r.datum,charge:{}});touch();renderMatSheet();renderMatList()};
  el.querySelectorAll("[data-ch]").forEach(inp=>inp.oninput=()=>{r.charge=r.charge||{};r.charge[inp.dataset.ch]=inp.value;r.chargeAangepast=true;touch()});
  $("#mat-opm").oninput=e=>{r.opmerking=e.target.value;touch()};
  el.querySelectorAll(".mat-card input[data-k]").forEach(inp=>{const k=inp.dataset.k;
    inp.oninput=()=>{r[k]=inp.value.trim()===""?null:num(inp.value);touch()};inp.onblur=()=>{inp.value=fmt(r[k])}});
  const updTot=k=>{const base=k.replace(/B$/,""),t=$("#mtot-"+base);if(t)t.textContent=fmt(matTot(r,base))};
  el.querySelectorAll(".mat-card [data-step]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,m=MATS.find(x=>x.k===k.replace(/B$/,""));
    const v=Math.max(0,Math.round(((r[k]||0)+Number(b.dataset.step)*m.stap)*100)/100);r[k]=v;$("#mat-"+k).value=fmt(v);updTot(k);touch()});
  el.querySelectorAll(".mat-card input[data-k]").forEach(inp=>inp.addEventListener("input",()=>updTot(inp.dataset.k)));

  $("#matSave").onclick=saveMat;
  const d=$("#matDelBtn");if(d)d.onclick=()=>{matDel=true;renderMatSheet()};
  const dn=$("#matDelNo");if(dn)dn.onclick=()=>{matDel=false;renderMatSheet()};
  const dy=$("#matDelYes");if(dy)dy.onclick=async()=>{
    if(r.id){try{await db.collection("instellingen").doc(r.id).delete();matRows=matRows.filter(x=>x.id!==r.id)}catch(e){matErr="Verwijderen mislukt.";matDel=false;return renderMatSheet()}}
    matDraft=null;matSel=null;matDirty=false;matDel=false;renderMatList();renderMatSheet()};
}
async function saveMat(){
  const r=matDraft;if(!r.datum){matErr="Vul een datum in.";return renderMatSheet()}
  matSaving=true;matErr="";renderMatSheet();
  try{const ch=chObj(r.charge,true);
    const rec={datum:r.datum,opmerking:(r.opmerking||"").trim(),charge:ch,bijgewerkt:Date.now()};MATS.forEach(m=>rec[m.k]=r[m.k]??null);LAK_K.forEach(k=>rec[k+"B"]=r[k+"B"]??null);
    const id=r.id||DOC_ID("mat_");await db.collection("instellingen").doc(id).set(rec);
    const ld=lakdagOp(r.datum);
    if(ld&&CH_K.some(k=>((ld.charge&&ld.charge[k])||"")!==ch[k])){await db.collection("lakdagen").doc(ld.id).update({charge:ch});ld.charge=ch;
      if(draft&&draft.id===ld.id&&!dirty)draft.charge={...ch}}
    r.chargeAangepast=false;
    r.id=id;matSel=id;matRows=matRows.filter(x=>x.id!==id).concat([{id,...rec}]);matDirty=false;matSaved=true;if(rec.datum)matMaand=rec.datum.slice(0,7)}
  catch(e){matErr=saveErr(e)}
  matSaving=false;renderMatList();renderMatSheet();
}
$("#btnMatNew").onclick=matNew;
// ===================== HERINNERING SLOTGATEN =====================
const SLOT_START="2026-10-13";          // lakdagen vanaf deze datum tellen mee
const SLOT_DAGEN=7;
function dagenGeleden(s){const d=parseDate(s);if(!d)return 0;const t=parseDate(today());return Math.round((t-d)/864e5)}
function slotOpen(r){return r.slotgaten==null&&!!r.datum&&r.datum>=SLOT_START&&dagenGeleden(r.datum)>=SLOT_DAGEN}
let slotGetoond=false;
function slotHerinnering(){
  if(slotGetoond)return;
  try{if(sessionStorage.getItem("slotHerinnerd")===today())return}catch(e){}
  const open=dagen.filter(slotOpen).sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  if(!open.length)return;
  slotGetoond=true;
  const m=$("#modal");
  m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalT">
    <h2 id="modalT">Terugkoppeling slotgaten invullen</h2>
    <p>Bij ${open.length===1?"deze lakdag":"deze "+open.length+" lakdagen"} is na een week nog geen terugkoppeling van de afdeling slotgaten ingevuld:</p>
    <ul>${open.slice(0,6).map(r=>`<li><button type="button" class="linkbtn" data-open="${esc(r.id)}">${esc(longDate(r.datum))}</button> <span class="hint">(${dagenGeleden(r.datum)} dagen geleden)</span></li>`).join("")}${open.length>6?`<li class="hint">en nog ${open.length-6} andere</li>`:""}</ul>
    <div class="row"><button class="btn primary" type="button" id="modalGo">Nu invullen</button><button class="btn" type="button" id="modalLater">Later</button></div>
  </div>`;
  m.hidden=false;
  const sluit=()=>{m.hidden=true;m.innerHTML="";try{sessionStorage.setItem("slotHerinnerd",today())}catch(e){}};
  const ga=id=>{sluit();if(tab!=="walsen"){setTab("walsen");if(tab!=="walsen")return}select(id);setTimeout(()=>{const el=$("#f-slot");if(el)el.scrollIntoView({block:"center"})},50)};
  $("#modalGo").onclick=()=>ga(open[0].id);
  $("#modalLater").onclick=sluit;
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>ga(b.dataset.open));
  m.onclick=e=>{if(e.target===m)sluit()};
  $("#modalGo").focus();
}
// ---- boot
let unsubs=[];
function stopListeners(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[]}
async function start(user){
  stopListeners();
  if(!user){authView=authView==="register"||authView==="reset"?authView:"login";$("#who").hidden=true;return renderAuth()}
  $("#whoEmail").textContent=user.email;
  if(!user.emailVerified){authView="verify";return renderAuth()}
  const email=(user.email||"").toLowerCase();
  const isAdmin=[].concat(window.LAKSTRAAT_BEHEERDER||[]).map(x=>String(x).toLowerCase()).includes(email);
  if(!isAdmin){
    try{const m=await db.collection("leden").doc(email).get(); if(!m.exists){authView="noaccess";return renderAuth()}}
    catch(e){authView="noaccess";return renderAuth()}
  }
  showOnly("app"); $("#btnUsers").hidden=!isAdmin;
  render();
  unsubs.push(db.doc("instellingen/walsen").onSnapshot(s=>{
    walsen=(s.exists&&Array.isArray(s.data().walsen))?s.data().walsen.map(w=>({id:w.id,naam:w.naam})):[];
    walsenLoaded=true; if(mode==="dag"&&!dirty)renderSheet();
  },()=>{$("#offline").hidden=false}));
  unsubs.push(db.collection("lakdagen").onSnapshot(s=>{
    $("#offline").hidden=true;
    dagen=s.docs.map(d=>({id:d.id,...d.data()}));
    dagenLoaded=true;
    if(draft && draft.id && !dirty && !saving){const rec=dagen.find(r=>r.id===draft.id); if(rec)draft=draftFrom(rec); else if(!dagen.length){draft=null;selectedId=null}}
    if(mode==="dag" && !dirty)render(); else renderList();
    if(!s.metadata||!s.metadata.fromCache)slotHerinnering();
  },e=>{$("#offline").hidden=false}));
  unsubs.push(db.collection("instellingen").where(firebase.firestore.FieldPath.documentId(),">=","g").onSnapshot(s=>{
    const docs=s.docs.map(d=>({id:d.id,...d.data()}));
    lampRows=docs.filter(d=>d.id.startsWith("lamp_")); regSheets=docs.filter(d=>d.id.startsWith("reg_"));
    storingen=docs.filter(d=>d.id.startsWith("stor_")); const tdd=docs.find(d=>d.id==="tdmail"); tdMail=(tdd&&tdd.email)||""; if(tab==="storingen")renderTdMail(); matRows=docs.filter(d=>d.id.startsWith("mat_")); matLoaded=true;
    if(tab==="materialen"){renderMatList();if(!matDirty&&!matSaving){if(matDraft&&matDraft.id){const r=matRows.find(x=>x.id===matDraft.id);matDraft=r?matFrom(r):null;if(!r)matSel=null}renderMatSheet()}}
    lampLoaded=true; regLoaded=true; stLoaded=true;
    if(tab==="storingen"){if(!$("#stLijst"))renderStoringen();else renderStLijst()}
    if(lsG("ms_pending")||msTerug)msHervat();
    if(tab==="lampen"&&!lampDirty&&!lampSaving&&!lampDel)renderLampen();
    if(tab==="registratie"){renderRegList();
      if(!regDirty&&!regSaving){if(regDraft&&regDraft.id){const r=regSheets.find(x=>x.id===regDraft.id);regDraft=r?regFrom(r):null;if(!r)regSel=null}renderRegSheet()}}
  },()=>{}));
  if(isAdmin) unsubs.push(db.collection("leden").onSnapshot(s=>{leden=s.docs.map(d=>d.id).sort();if(mode==="users")renderUsers($("#sheet"))},()=>{}));
}

$("#btnNew").onclick=startChecklist;
$("#btnSetup").onclick=openSetup;
$("#btnExport").onclick=exportWord;
$("#btnUsers").onclick=()=>{if(tab!=="walsen"){setTab("walsen");if(tab!=="walsen")return}mode="users";renderUsers($("#sheet"))};
$("#btnLogout").onclick=()=>{dagen=[];walsen=[];draft=null;selectedId=null;dirty=false;mode="dag";
  lampRows=[];lampEdits={};lampNew=blankLampRows();lampDirty=false;storingen=[];stEdit=null;stDirty=false;stQ="";matRows=[];matDraft=null;matSel=null;matDirty=false;regSheets=[];regDraft=null;regSel=null;regDirty=false;tab="walsen";
  firebase.auth().signOut()};

if(!window.firebase||!window.LAKSTRAAT_FIREBASE){$("#authBox").hidden=false;$("#authBox").innerHTML="<h2>Niet ingesteld</h2><p>De koppeling met de database ontbreekt (config.js).</p>"}
else{
  firebase.initializeApp(window.LAKSTRAAT_FIREBASE);
  db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>start(u));
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
